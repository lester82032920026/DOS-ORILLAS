<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--c:#fff;--tx:#17202e;--mu:#5d6b7d;--ac:#e8476a;--ac2:#2a9fe0;--ln:#dde3ea;--hl:#fdeef2;--rd:#c0392b;--ok:#0b8a5f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--c:#18222e;--tx:#e8eef5;--mu:#97a6b8;--ln:#2a3846;--hl:#2a1c28;--rd:#ff7a6e;--ok:#3ec79f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(90deg,#e8476a,#8e7fd6 50%,#38b6ff);color:#fff;text-align:center;padding:22px 12px;text-shadow:0 2px 6px #0004}
h1{margin:0;font:clamp(2.2rem,9vw,4.2rem)/1 Pacifico,cursive}
.who{margin:8px 0 0;font-size:clamp(1.1rem,4vw,1.6rem);font-weight:700;letter-spacing:1px}.who i{font-style:normal;margin:0 8px}.sub{font-size:.8rem;opacity:.9}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--c);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5}nav button{white-space:nowrap}
main{max-width:1150px;margin:0 auto;padding:12px}.card{background:var(--c);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx)}button{padding:7px 12px;border-radius:8px;border:1px solid var(--ln);background:var(--c);cursor:pointer}
button.on,button.pr{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0}
input,select{padding:6px 8px;border:1px solid var(--ln);border-radius:7px;background:var(--bg);max-width:100%}td input{width:80px}td input.w{width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.k{background:var(--hl);border-radius:10px;padding:10px}.k small{color:var(--mu);display:block}.k b{font-size:1.2rem}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.85rem}th,td{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:left;white-space:nowrap}th{color:var(--mu)}tr.cat td{background:var(--hl);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}.row label{font-size:.78rem;color:var(--mu);display:block}.mu{color:var(--mu);font-size:.82rem}.neg{color:var(--rd)}.pos{color:var(--ok)}
img.t{width:38px;height:38px;object-fit:cover;border-radius:6px;vertical-align:middle}a{color:var(--ac2)}
#lg{max-width:340px;margin:40px auto}
</style></head><body>
<header><h1>Dos Orillas</h1><div class="who">Yuly <i>__</i> Osvaldo</div><div class="sub">Punto de Venta · pedidos, envíos y encargos entre dos orillas</div></header>
<div id="root"></div>
<script>
const SEED=`Aseos|W|Champú sachets:.05:.02:220;Crema dental mini:.3:.1:1200;Desodorante roll-on:.8:.25:3000;Jabón de baño:.35:.2:700;Cepillo dental:.25:.06:500;Toallas sanitarias pack:1.2:.3:2200;Maquinillas de afeitar pack:1.5:.15:2500;Detergente en sobres:.2:.1:450

Insumos de pesca|A|Anzuelos caja x100:2.5:.2:4500;Hilo nylon carrete:1.5:.2:3000;Plomadas bolsa:2:.8:3500;Boyas flotadores pack:1.5:.1:2500;Señuelos artificiales pack:3:.2:5000;Carrete de pesca:8:.8:14000;Giratorios destorcedores pack:1.2:.05:2200;Pinza/cuchillo de pesca:2:.3:4000

Accesorios para móviles|A|Cargador rápido USB-C:3:.2:5000;Cable USB-C:.8:.1:2000;Audífonos básicos:1.2:.1:2500;Cover universal:1:.1:2000;Cristal templado:.4:.03:1000;Power bank 10000 mAh:9:.6:15000;Soporte móvil para moto:2:.3:3800;Memoria microSD 64 GB:5:.02:8500
Pantallas y repuestos móviles|B|Pantalla Samsung A10:9:.4:16000;Pantalla Xiaomi Redmi 9:10:.4:18000;Batería genérica:4:.2:8000;Flex puerto de carga:1.5:.05:3500;Kit destornilladores precisión:3:.3:5000;Pegamento B7000:1.2:.1:2500;Altavoz/auricular repuesto:1:.03:2200;Tapa trasera repuesto:2.5:.2:5000`;
const SUP={A:["Amazon","https://www.amazon.com/s?k="],B:["Alibaba","https://www.alibaba.com/trade/search?SearchText="],S:["SHEIN","https://us.shein.com/pdsearch/"],D:["DHgate","https://www.dhgate.com/wholesale/search.do?searchkey="],W:["Walmart","https://www.walmart.com/search?q="],T:["Temu","https://www.temu.com/search_result.html?search_key="],K:["TikTok Shop","https://www.tiktok.com/search?q="],X:["AliExpress","https://www.aliexpress.com/wholesale?SearchText="],C:["Costco","https://www.costco.com/CatalogSearch?keyword="]};
const KEY="dos-orillas-v3",USERS={osvaldo:"Abri2026",yuly:"61403"};
const K=[["inv","Invertido USD"],["sold","Vendido CUP"],["conv","CUP convertidos"],["usdc","USD obtenidos"],["sent","USD enviados"],["pend","Pendiente de retorno USD"],["profit","Ganancia total CUP"],["gO","Ganancia Osvaldo CUP"],["gF","Ganancia Yuly CUP"],["cash","Efectivo CUP"],["stock","Valor stock USD"],["transit","En tránsito USD"],["units","Unidades vendidas"],["encp","Encargos pendientes (und)"],["abon","Anticipos de clientes CUP"]];
const UID=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S,me=null;
try{S=JSON.parse(localStorage.getItem(KEY));me=sessionStorage.getItem("u")}catch(e){}
if(!S){S={cfg:{rate:860,fee:5,ship:6,sh:50,mg:40,u:0},cats:[],p:[],orders:[],sales:[],conv:[],rets:[],enc:[],kpi:Object.fromEntries(K.map(k=>[k[0],1]))};
SEED.split("\n").forEach((l,i)=>{const[n,s,ps]=l.split("|");S.cats.push({id:"c"+i,n,s,u:0});ps.split(";").forEach((x,j)=>{const a=x.split(":");S.p.push({id:`p${i}_${j}`,cat:"c"+i,n:a[0],cost:+a[1],w:+a[2],pr:0,min:0,star:j<2,u:0})})})}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Memoria llena: exporta una salva y quita fotos pesadas")}};
const C=()=>S.cfg,L=a=>S[a].filter(i=>!i.x),$=s=>document.querySelector(s),v=i=>document.getElementById(i).value,E=s=>String(s??"").replace(/"/g,"&quot;");
const N=(x,d=0)=>(+x||0).toLocaleString("es",{minimumFractionDigits:d,maximumFractionDigits:d}),fx=()=>C().rate*(1+C().fee/100),td=()=>new Date().toISOString().slice(0,10);
const st=o=>{o.u=Date.now();o.by=me;return o},pp=id=>S.p.find(p=>p.id==id)||{n:"(eliminado)",cost:0,w:0,pr:0},cat=id=>S.cats.find(c=>c.id==id)||{n:"?",s:"A"};
const land=p=>p.lc||p.cost+p.w*C().ship,back=p=>land(p)*fx();
function od(o){const base=l=>o.m=="valor"?l.q*l.c:o.m=="unidades"?l.q:l.q*pp(l.pid).w,T=o.lines.reduce((a,l)=>a+base(l),0)||1;return o.lines.map(l=>{const sh=o.ship*base(l)/T;return{...l,sh,f:l.c+sh/(l.q||1)}})}
function calc(){let inv=0,transit=0,rec={},sold={},soldC=0,cogs=0,units=0,encp=0,abon=0;
L("orders").forEach(o=>{const t=od(o).reduce((a,l)=>a+l.q*l.c,0)+ +o.ship;inv+=t;if(o.st=="Recibido")o.lines.forEach(l=>rec[l.pid]=(rec[l.pid]||0)+l.q);else transit+=t});
L("sales").forEach(s=>{soldC+=s.q*s.pr;cogs+=s.q*land(pp(s.pid));units+=s.q;sold[s.pid]=(sold[s.pid]||0)+s.q});
const dem={};L("enc").forEach(e=>{if(e.st!="Entregado"){encp+=e.q;abon+=+e.ab||0;dem[e.pid]=(dem[e.pid]||0)+e.q}});
const profit=soldC-cogs*fx(),gO=profit*C().sh/100,gF=profit-gO,owed=cogs+Math.max(gF,0)/fx(),sent=L("rets").reduce((a,r)=>a+r.usd,0),cv=L("conv").reduce((a,r)=>a+r.cup,0);
let stock=0;L("p").forEach(p=>stock+=((rec[p.id]||0)-(sold[p.id]||0))*land(p));
return{inv,transit,rec,sold,soldC,profit,gO,gF,owed,sent,pend:owed-sent,cv,usdc:cv/fx(),cash:soldC-cv,stock,units,encp,abon,dem}}
let tab="res",cf="Todas",q="",C0;
const T=[["res","Resumen"],["cat","Catálogo"],["ped","Pedidos"],["enc","Encargos"],["fin","Finanzas"],["gui","Guía"],["cfg","Ajustes y salvas"]];
const hit=s=>!q||s.toLowerCase().includes(q.toLowerCase()),sr=()=>`<input id="q" placeholder="🔍 Buscar..." value="${E(q)}" style="width:100%;max-width:340px">`;
function R(){if(!me){return $("#root").innerHTML=`<div class="card" id="lg"><h3>Entrar</h3><div class="row"><div><label>Usuario</label><input id="lu"></div><div><label>Contraseña</label><input id="lp" type="password"></div><button class="pr" id="lgo">Entrar</button></div><p class="mu" id="le"></p></div>`}
C0=calc();const m={res,cat:cats,ped,enc,fin,gui,cfg}[tab]();
$("#root").innerHTML=`<nav>${T.map(t=>`<button class="${tab==t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}<span class="mu" style="margin-left:auto;align-self:center">👤 ${me}</span></nav><main>${m}</main>`;document.querySelectorAll("button[data-x]").forEach(b=>{const e=document.createElement("button");e.textContent="✏️";e.dataset.e=b.dataset.x;b.before(e)});document.querySelectorAll("button[data-dl]").forEach(b=>{const e=document.createElement("button");e.textContent="✏️";e.dataset.el=b.dataset.dl;b.before(e)});save();const x=$("#q");if(x&&q){x.focus();x.setSelectionRange(q.length,q.length)}}
function res(){const c=C0,V={inv:N(c.inv,2),sold:N(c.soldC),conv:N(c.cv),usdc:N(c.usdc,2),sent:N(c.sent,2),pend:N(c.pend,2),profit:N(c.profit),gO:N(c.gO),gF:N(c.gF),cash:N(c.cash),stock:N(c.stock,2),transit:N(c.transit,2),units:N(c.units),encp:N(c.encp),abon:N(c.abon)};
const al=L("p").filter(p=>p.min>0&&(c.rec[p.id]||0)-(c.sold[p.id]||0)<=p.min);
return`<div class="card"><b>Mostrar en resumen:</b><div class="row">${K.map(k=>`<label><input type="checkbox" data-k="${k[0]}" ${S.kpi[k[0]]?"checked":""}> ${k[1]}</label>`).join("")}</div></div>
<div class="grid">${K.filter(k=>S.kpi[k[0]]).map(k=>`<div class="k"><small>${k[1]}</small><b>${V[k[0]]}</b></div>`).join("")}</div>
<div class="card" style="margin-top:14px"><b>Retorno a Estados Unidos</b><p>Tasa efectiva ${N(fx(),1)} CUP/USD (${C().rate} + ${C().fee}%). Ganancia: Osvaldo ${C().sh}% / Yuly ${100-C().sh}%.</p><p>Pendiente de enviar: <b>USD ${N(c.pend,2)}</b> = <b>${N(Math.max(c.pend,0)*fx())} CUP</b>. Si el USD sube 5%: ${N(Math.max(c.pend,0)*fx()*1.05)} CUP; 10%: ${N(Math.max(c.pend,0)*fx()*1.1)} CUP.</p></div>
<div class="card"><b>Alertas</b>${al.length?al.map(p=>`<p class="neg">⚠ Stock bajo: ${p.n}</p>`).join(""):"<p class='mu'>Sin alertas de stock (define el mínimo en el Catálogo).</p>"}<b>Más pedidos por clientes</b>${Object.entries(c.dem).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([id,n])=>`<p>${pp(id).n}: ${n} und</p>`).join("")||"<p class='mu'>Aún no hay encargos.</p>"}</div>`}
function cats(){const c=C0,cs=[["Todas"],...L("cats").map(x=>[x.n,x.id])];
return`<div class="card">${sr()}<div class="row">${cs.map(x=>`<button class="${cf==x[0]?"on":""}" data-c="${x[0]}">${x[0]}</button>`).join("")}</div><p class="mu">Costos de referencia estimados (nivel tienda minorista): ajústalos a lo que de verdad pagues; en Temu, TikTok Shop o mayoristas suelen ser menores. "Costo Cuba" = producto + envío + comisión de conversión. Los precios de venta los pone Yuly; usa 🔗 Ver para comparar el producto en varias tiendas.</p><div class="row"><label><input type="checkbox" data-cf="gm" ${C().gm?"checked":""}> Usar margen comercial global</label>${C().gm?`<div><label>Margen %</label><input type="number" data-cf="mg" value="${C().mg}"></div><button class="pr" id="applymg">Aplicar a todos los productos</button><span class="mu">Después puedes cambiar cualquier precio a mano.</span>`:""}</div>
<div class="tw"><table><tr><th>Foto</th><th>Producto</th><th>Costo USD</th><th>Peso lb</th><th>Costo Cuba CUP</th><th>Precio CUP (Yuly)</th><th>Ganancia/u</th><th>Margen</th><th>Stock</th><th>Mín</th><th>Encargos</th><th>⭐</th><th></th></tr>
${L("cats").filter(k=>cf=="Todas"||cf==k.n).map(k=>{const r=L("p").filter(p=>p.cat==k.id&&hit(p.n+k.n));return r.length?`<tr class="cat"><td colspan="14">${k.n} <button data-e="cats|${k.id}">✏️</button></td></tr>`+r.map(p=>{const b=back(p),g=p.pr-b;return`<tr><td>${p.img?`<img class="t" src="${p.img}">`:""}<label>📷<input type="file" accept="image/*" hidden data-ph="${p.id}"></label></td><td><input class="w" data-a="p" data-i="${p.id}" data-f="n" value="${E(p.n)}"> <select data-go="${E(p.n)}" style="width:68px"><option>🔗 Ver</option>${Object.entries(SUP).map(([a,x])=>`<option value="${a}">${x[0]}</option>`).join("")}</select></td><td><input type="number" step=".01" data-a="p" data-i="${p.id}" data-f="cost" value="${p.cost}"></td><td><input type="number" step=".01" data-a="p" data-i="${p.id}" data-f="w" value="${p.w}"></td><td>${N(b)}</td><td><input type="number" placeholder="Yuly" data-a="p" data-i="${p.id}" data-f="pr" value="${p.pr||""}"></td><td class="${p.pr&&g<0?"neg":"pos"}">${p.pr?N(g):"—"}</td><td>${b&&p.pr?N(g/b*100)+"%":"—"}</td><td>${(c.rec[p.id]||0)-(c.sold[p.id]||0)}</td><td><input type="number" data-a="p" data-i="${p.id}" data-f="min" value="${p.min||0}"></td><td>${c.dem[p.id]||0}</td><td><input type="checkbox" data-a="p" data-i="${p.id}" data-f="star" ${p.star?"checked":""}></td><td><button data-x="p|${p.id}">✕</button></td></tr>`}).join(""):""}).join("")}</table></div></div>
<div class="card"><b>Nueva categoría</b><div class="row"><div><label>Nombre</label><input id="nc"></div><div><label>Tienda sugerida</label><select id="ns">${Object.entries(SUP).map(([k,x])=>`<option value="${k}">${x[0]}</option>`).join("")}</select></div><button class="pr" id="addc">Crear</button></div>
<b>Nuevo producto</b><div class="row"><div><label>Categoría</label><select id="pc">${L("cats").map(k=>`<option value="${k.id}">${k.n}</option>`).join("")}</select></div><div><label>Nombre</label><input id="pn"></div><div><label>Costo USD</label><input id="pco" type="number" step=".01"></div><div><label>Peso lb</label><input id="pw" type="number" step=".01"></div><div><label>Precio CUP</label><input id="ppr" type="number"></div><button class="pr" id="addp">Agregar</button></div></div>`}
const popt=()=>L("p").map(p=>`<option value="${p.id}">${p.n}${C0.dem[p.id]?` (encargos: ${C0.dem[p.id]})`:""}</option>`).join("");
function ped(){return`<div class="card"><b>Nuevo pedido</b> <span class="mu">El costo del envío se reparte entre los productos y da el costo final por unidad.</span><div class="row"><div><label>Nombre</label><input id="on"></div><div><label>Reparto del envío por</label><select id="om"><option value="peso">Peso</option><option value="valor">Valor</option><option value="unidades">Unidades</option></select></div><div><label>Costo total envío USD</label><input id="os" type="number" step=".01"></div><button class="pr" id="addo">Crear</button></div>${sr()}</div>
${L("orders").filter(o=>hit(o.n+o.lines.map(l=>pp(l.pid).n).join())).reverse().map(o=>{const d=od(o),tot=d.reduce((a,l)=>a+l.q*l.f,0);return`<div class="card"><div class="row"><b>${o.n}</b> <span class="mu">${o.d} · ${o.by||""}</span><div><label>Estado</label><select data-a="orders" data-i="${o.id}" data-f="st">${["Planificado","Enviado","Recibido"].map(s=>`<option ${o.st==s?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Reparto</label><select data-a="orders" data-i="${o.id}" data-f="m">${["peso","valor","unidades"].map(s=>`<option ${o.m==s?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Envío USD</label><input type="number" step=".01" data-a="orders" data-i="${o.id}" data-f="ship" value="${o.ship}"></div><button data-x="orders|${o.id}">✕</button></div>
<div class="tw"><table><tr><th>Producto</th><th>Cant.</th><th>Compra USD</th><th>Envío prorrateado</th><th>Costo final/u USD</th><th>Costo final CUP</th><th>Precio venta</th><th>Margen</th><th></th></tr>${d.map((l,i)=>{const cp=l.f*fx(),pr=pp(l.pid).pr;return`<tr><td>${pp(l.pid).n}</td><td>${l.q}</td><td>${N(l.c,2)}</td><td>${N(l.sh,2)}</td><td>${N(l.f,2)}</td><td>${N(cp)}</td><td>${pr?N(pr):"—"}</td><td class="${pr&&pr<cp?"neg":"pos"}">${pr&&cp?N((pr-cp)/cp*100)+"%":"—"}</td><td><button data-dl="${o.id}|${i}">✕</button></td></tr>`}).join("")}</table></div>

function gui(){return`<div class="card"><h3>Cómo funciona</h3><ol><li><b>Osvaldo</b> (EE. UU.) arma un <b>Pedido</b>: agrega productos, cantidades y precios de compra, y pone el costo total del envío. La app lo reparte (por peso, valor o unidades) y da el costo final por producto.</li><li>Osvaldo pulsa <b>Enviar salva</b> (Ajustes) y se la manda a Yuly por WhatsApp o correo.</li><li><b>Yuly</b> (Cuba) importa la salva, mira el mercado, fija los <b>precios de venta</b> y comprueba el margen. Si no conviene, ajusta el pedido y devuelve otra salva.</li><li>Yuly registra <b>Encargos</b> de clientes con anticipo. Antes de comprar, el pedido se basa en encargos ya confirmados.</li><li>Al llegar, el pedido pasa a <b>Recibido</b> y suma al stock. Cada venta o entrega de encargo se registra en <b>Finanzas</b>.</li><li>Se registran las <b>conversiones</b> CUP a USD (con la comisión) y los <b>retornos</b> enviados. El Resumen muestra cuánto falta devolver y la ganancia de cada uno.</li></ol>
<h3>Estrategia</h3><ul><li><b>Vender primero, comprar después:</b> pedidos por encargo reducen el riesgo y el dinero inmovilizado.</li><li><b>Ciclo fijo:</b> cada 2–4 semanas se cierra la lista de encargos, se compra, se envía y se cobra.</li><li><b>Surtido:</b> mezcla productos de salida rápida (aseo, alimentos, accesorios) con otros de más margen (repuestos, refrigeración, motos).</li><li><b>Peso pequeño, valor alto:</b> el envío se paga por libra, así que conviene lo ligero y demandado.</li><li><b>Cuida el dólar:</b> si sube, revisa precios. El Resumen simula +5% y +10%.</li><li><b>Reinversión:</b> devuelve primero el capital, reparte la ganancia y deja una parte para el siguiente pedido.</li></ul></div><div class="card"><h3>Dónde comprar más barato</h3><p>Quien vende barato en Cuba suele comprar en origen, por bulto y comparando. Los costos del catálogo son de referencia minorista; compáralos con estas fuentes:</p><ul><li><b>Temu y TikTok Shop:</b> precios muy bajos en ropa, accesorios, aseo y piezas pequeñas. Compara 2–3 vendedores, revisa reseñas y tiempos de entrega, y recibe en la dirección del amigo.</li><li><b>AliExpress, DHgate, Alibaba:</b> precio por lote. Útiles para repuestos de móviles, motos eléctricas y refrigeración. Pregunta si envían a EE. UU. o usa un consolidador.</li><li><b>Mayoristas locales</b> en la ciudad del amigo (Miami, Hialeah, Doral u otras): compra por caja sin intermediarios y pregunta qué proveedores usan sus colegas.</li><li><b>Packs de Costco, Sam's, Walmart, Dollar Tree y Five Below:</b> buenos para aseo y alimentos en formato pequeño.</li><li><b>Liquidación</b> (Liquidation.com, B-Stock): cajas de devoluciones muy baratas, pero mezcladas y sin garantía.</li><li><b>Grupos de revendedores</b> en Facebook y WhatsApp: ofertas y proveedores que ya funcionan.</li></ul><p><b>Cómo decidir:</b> crea el mismo pedido con cada fuente y elige la de menor costo final por unidad. Cotiza también el envío con la agencia, porque agrupar bultos puede bajar el costo por libra. Verifica siempre los límites de aduana.</p></div>`}
